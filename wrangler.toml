name = "follow-panel-cloudflare"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "follow-panel-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
SITE_NAME = "ربات فالور رایگان"
SMS_BASE = "https://api.siteesho.com/api/users"
SUPPORT_USERNAME = "@followe_free"
